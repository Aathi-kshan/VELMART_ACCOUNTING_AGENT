[project]
name = "velmart-api"
version = "0.1.0"
description = "Velmart — AI business data management and accounting platform (API)"
requires-python = ">=3.13,<3.14"
dependencies = [
    # web
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.9",
    # data
    "sqlalchemy[asyncio]==2.0.44",
    "asyncpg==0.31.0",
    "alembic==1.17.1",
    # validation
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5",
    # auth
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    # ops
    "structlog>=24.4",
    "sentry-sdk[fastapi]>=2.17",
    # external services
    "boto3>=1.35",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]  # DDL reads better unwrapped

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
