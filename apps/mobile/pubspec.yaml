name: velmart
description: Velmart — AI business data-management and accounting platform (client)
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  # State management (plan section 6)
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # HTTP — interceptors for token refresh and retry
  dio: ^5.7.0

  # Routing — role-based guards
  go_router: ^14.6.2

  # Secure token storage (Keychain / Keystore)
  flutter_secure_storage: ^9.2.2

  # Device-id generation for refresh-token binding (plan section 20.2) and
  # client_uuid / Idempotency-Key on record creates (plan section 21.1)
  uuid: ^4.5.1

  # Date formatting. Appendix A.1: "use intl from day one so Sinhala is a
  # translation file later, not a rewrite". Money keeps its own formatter —
  # int minor units must never round-trip through a locale parser.
  intl: ^0.19.0

  # Removed here, all three unused and all three costly to keep:
  #
  #   drift / sqlite3_flutter_libs — declared for an offline cache (P6) that
  #     was cut from scope. Nothing in lib/ or test/ ever imported them, but
  #     `sqlite3_flutter_libs` is a *native* plugin, so it was still compiled
  #     into the generated macOS/iOS SwiftPM package and dragged into every
  #     native build for no benefit.
  #   fl_chart — declared for the dashboard-widget charts. That feature is
  #     removed (nothing could ever create a widget), and no file imported it.
  #
  # `share_plus` below is genuinely used by the CSV export and stays.

  # CSV export (plan section 13.2, P3.5 Part 2) — hands the exported file to
  # the OS share sheet (Save to Files, AirDrop, email, ...) rather than
  # requesting storage permissions or picking a save location ourselves.
  share_plus: ^10.1.4

  cupertino_icons: ^1.0.8

  # Inter is the product font (design system §5.1) — bundled via this
  # package rather than shipping font assets ourselves.
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.13
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/brand/velmart-mark.jpg
