# Local development stack (plan section 23.2).
# Production is Railway; this exists so the same Postgres major version can be
# run locally. From the repository root:
#
#   docker compose -f infra/docker-compose.yml up -d postgres
#   docker compose -f infra/docker-compose.yml up api

name: velmart

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: velmart
      POSTGRES_PASSWORD: velmart
      POSTGRES_DB: velmart
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ images expect a single mount at /var/lib/postgresql (not
      # .../data) so PGDATA can live in a version-specific subdirectory,
      # matching how pg_ctlcluster / pg_upgrade expect the layout to work.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velmart -d velmart"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: DEBUG
      # Compose networking: the host is the service name, not localhost.
      DATABASE_URL: postgresql://velmart:velmart@postgres:5432/velmart
      JWT_SECRET_KEY: local-development-only-not-a-real-secret-change-me-please
    ports:
      - "8000:8000"
    # Migrations are a deliberate pre-deploy step, never the start command
    # (plan section 23.6). Run them explicitly:
    #   docker compose -f infra/docker-compose.yml run --rm api alembic upgrade head
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  # The nightly maintenance job — audit chain verify, pg_dump backup,
  # idempotency cleanup, daily digest. In production this runs as a Railway
  # cron service (infra/railway.cron.json); here it is a one-shot so the job
  # can actually be exercised locally instead of only ever running unattended
  # in an environment nobody watches. Nothing scheduled it anywhere before
  # this pass, so it had never run at all.
  #
  #   docker compose -f infra/docker-compose.yml run --rm nightly
  #
  # Behind a profile so `up` does not start it as a long-running service.
  nightly:
    profiles: ["ops"]
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql://velmart:velmart@postgres:5432/velmart
      # pg_dump needs the schema-owning role, not app_user.
      DATABASE_URL_MIGRATOR: postgresql://velmart:velmart@postgres:5432/velmart
      JWT_SECRET_KEY: local-development-only-not-a-real-secret-change-me-please
      # A mounted directory, not /tmp — otherwise the dump dies with the
      # container and the backup is a no-op that reports success.
      BACKUP_DIR: /backups
    volumes:
      - ../backups:/backups
    command: ["python", "-m", "app.tasks.nightly"]

volumes:
  postgres_data:
