name: mobile-ci

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-ci.yml"

defaults:
  run:
    working-directory: apps/mobile

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.x"
          channel: stable

      # The "skip if no pubspec.yaml" guard that used to live here gated
      # every step below on the file's presence — meaning this workflow
      # would report green having run zero checks the moment pubspec.yaml
      # was deleted or renamed. apps/mobile has been a real Flutter app
      # since P1; there is no scaffold state left to guard for, and a
      # missing pubspec.yaml now fails `flutter pub get` loudly instead of
      # skipping silently.
      - run: flutter pub get

      - run: dart analyze --fatal-infos

      - run: flutter test
